services:
  app:
    build: .
    environment:
      SK_TOKEN: ${SK_TOKEN:?set SK_TOKEN in .env}
      SK_KIST_URL: ${SK_KIST_URL:-}
      SK_KIST_TOKEN: ${SK_KIST_TOKEN:-}
      SK_KIST_ROOT_FOLDER: ${SK_KIST_ROOT_FOLDER:-SolidCraft}
      SK_GITHUB_TOKEN: ${SK_GITHUB_TOKEN:-}
      SK_FORGEJO_URL: ${SK_FORGEJO_URL:-}
      SK_FORGEJO_TOKEN: ${SK_FORGEJO_TOKEN:-}
      SK_SCAN_INTERVAL_MINUTES: ${SK_SCAN_INTERVAL_MINUTES:-360}
      SK_RENDER_PROCESSES: ${SK_RENDER_PROCESSES:-4}
      # gpu | software | off: where this server renders until Settings → Rendering says otherwise.
      SK_RENDERER: ${SK_RENDERER:-gpu}
      # Quiet hours (Settings → Rendering) are in this time zone.
      TZ: ${TZ:-UTC}
      # This server's name in report.json and the title block ("server" if empty).
      SK_HOST_NAME: ${SK_HOST_NAME:-}
    ports:
      - "${SK_PORT:-8090}:8000"
    volumes:
      - ${SK_DATA:-./data}:/data
    # The GPU. Drop these two keys on a host without /dev/dri: rendering falls back
    # to Mesa's software Vulkan (slower, same pictures).
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${SK_RENDER_GID:-992}"
    restart: unless-stopped
