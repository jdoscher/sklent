<!doctype html>
<html lang="en" data-theme="gallery">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>sklent</title>
  <meta name="description" content="Turn a CAD repo into a showcase: SolidCraft designs rendered to turntables, reels, stills and GIFs." />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=4" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
  <link rel="manifest" href="/static/manifest.webmanifest?v=1" />
  <meta name="theme-color" content="#5C5C5C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- paints the stored theme before the stylesheets arrive -->
  <script src="/static/theme-init.js?v=1"></script>
  <link rel="preload" href="/static/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/static/css/kist-tokens.css" />
  <link rel="stylesheet" href="/static/css/sk-tokens.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/shell.css" />
  <link rel="stylesheet" href="/static/css/grid.css" />
  <link rel="stylesheet" href="/static/css/detail.css" />
  <link rel="stylesheet" href="/static/css/floats.css" />
  <link rel="stylesheet" href="/static/css/gate.css" />
  <link rel="stylesheet" href="/static/css/phone.css" />
  <link rel="stylesheet" href="/static/css/features/views.css" />
</head>
<body>
  <div id="gate" class="token-gate" hidden>
    <form id="gate-form" class="gate-card" aria-labelledby="gate-title">
      <div class="gc gc-brand">
        <span class="lockup"><img src="/static/favicon.svg?v=4" alt="" class="lockup-mark" /><span class="wordmark" id="gate-title">sklent</span></span>
        <span class="tag">CAD repo to showcase</span>
      </div>
      <div class="gc">
        <label class="caps dim" for="gate-token">Access token</label>
        <p class="dim">Paste the token from <span class="mono">SK_TOKEN</span> in this server’s <span class="mono">.env</span>. It stays in this browser.</p>
        <input id="gate-token" type="password" autocomplete="current-password" placeholder="SK_TOKEN" spellcheck="false" autofocus />
        <button class="primary" type="submit">Continue</button>
        <p id="gate-error" class="error" role="alert"></p>
      </div>
      <div class="gc gc-foot"><span class="mono" id="gate-version">sklent</span><span class="mono" id="gate-host"></span></div>
    </form>
  </div>

  <div id="app" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Menu" aria-controls="sidebar" aria-expanded="false" data-icon="menu:20"></button>
        <img src="/static/favicon.svg?v=4" alt="" class="brand-mark" />
        <span class="wordmark">sklent</span>
      </div>
      <form id="url-form" class="url-form">
        <label class="url-field">
          <span class="url-icon" data-icon="link-2"></span>
          <span class="visually-hidden">Repository URL</span>
          <input id="url" autocomplete="off" spellcheck="false" placeholder="Paste a GitHub or Forgejo URL: account, repo, folder or .sc file" />
        </label>
        <button type="submit" class="primary" data-action="render">Render</button>
        <button type="button" id="add-only" title="Add as a source without rendering">Add source</button>
      </form>
      <span class="spacer"></span>
      <span class="bar-sep" aria-hidden="true"></span>
      <span id="kist-chip" class="kist-status"><span class="dot" aria-hidden="true"></span><span class="kist-word">Kist</span></span>
      <button type="button" class="icon-btn" id="open-appearance" aria-label="Appearance" aria-haspopup="menu" aria-expanded="false" data-icon="palette"></button>
      <button type="button" class="icon-btn" id="open-settings" aria-label="Render settings" data-icon="settings"></button>
      <nav class="filter-row" id="filter-row" aria-label="Views"></nav>
    </header>
    <div class="app-body">
      <nav class="sidebar" id="sidebar" aria-label="Designs, sources and jobs">
        <div class="drawer-head">
          <span class="lockup"><img src="/static/favicon.svg?v=4" alt="" class="brand-mark" /><span class="wordmark">sklent</span></span>
          <span class="drawer-tools">
            <button type="button" class="icon-btn" data-open="appearance" aria-label="Appearance" aria-haspopup="menu" data-icon="palette:20"></button>
            <button type="button" class="icon-btn" data-open="settings" aria-label="Render settings" data-icon="settings:20"></button>
          </span>
          <button type="button" class="icon-btn drawer-close" id="drawer-close" aria-label="Close menu" data-icon="x:20"></button>
        </div>
        <div id="sidebar-sections"></div>
      </nav>
      <main class="grid-area">
        <div class="grid-head">
          <h1 class="view-title" id="view-title">All designs</h1>
          <span class="title-count" id="title-count"></span>
          <span class="spacer"></span>
          <span class="scope mono" id="grid-scope"></span>
          <input id="search" class="search" type="search" placeholder="Filter designs" aria-label="Filter designs" />
        </div>
        <div class="grid-scroll" id="grid-scroll"><div id="grid" class="grid"></div></div>
      </main>
    </div>
    <div class="scrim drawer-scrim" id="drawer-scrim" hidden></div>
  </div>

  <div id="detail" class="overlay sheet-overlay" hidden>
    <div class="detail sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="viewer" id="viewer"></div>
      <aside class="detail-side" id="detail-side"></aside>
    </div>
  </div>

  <div id="settings" class="overlay" hidden>
    <form class="dialog spec-sheet" id="settings-form" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="sk-sh">
        <h2 id="settings-title">Render settings</h2>
        <p>Applies to the next renders. Parts are only ever rendered in these two colours.</p>
      </div>
      <div class="sk-body" id="settings-body"></div>
      <p class="error" id="settings-error" role="alert"></p>
      <div class="sk-foot">
        <span class="sum mono" id="settings-sum"></span>
        <button type="button" data-close>Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>

  <div id="menu-appearance" class="menu" role="menu" aria-label="Appearance" hidden></div>
  <div id="confirm" class="overlay" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
